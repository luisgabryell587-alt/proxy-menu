name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager não foi encontrado"
            find "$SDK_ROOT" -type f -name sdkmanager || true
            exit 1
          fi

          echo "SDK encontrado em: $SDK_ROOT"
          echo "sdkmanager encontrado em: $SDKMANAGER"

          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "build-tools;35.0.0"

      - name: Baixar Apktool
        run: |
          curl -fL \
            -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Compilar APK
        run: |
          java -jar apktool.jar b . -o app-unsigned.apk

      - name: Criar chave de teste
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assinar APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          if [ ! -f "$APKSIGNER" ]; then
            echo "apksigner não foi encontrado"
            find "$ANDROID_HOME/build-tools" -type f -name apksigner || true
            exit 1
          fi

          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out app.apk \
            app-unsigned.apk

      - name: Verificar APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            app.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-compilado
          path: app.apk
          
