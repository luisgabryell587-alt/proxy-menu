name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Instalar Android SDK e build-tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;35.0.0"
          

      - name: Baixar Apktool
        run: |
          curl -L -o apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar

      - name: Compilar APK
        run: java -jar apktool.jar b . -o app-unsigned.apk

      - name: Criar chave
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Assinar APK
        run: |
          $ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out app.apk \
            app-unsigned.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-compilado
          path: app.apk
          
